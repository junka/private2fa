name: "CodeQL"

# 代码安全静态扫描：JavaScript/TypeScript + 工作流自身。
# 结果上传到仓库 Security → Code scanning 页面。
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * 1" # 每周一 02:17 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write # 上传 SARIF 结果需要
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      # autobuild 会自动执行 npm install + 项目构建用于构建依赖追踪
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"