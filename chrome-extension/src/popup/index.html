<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>OTP Safebox</title>
  <style>
    :root { --indigo: #4f46e5; --indigo-dark: #4338ca; --bg: #f8fafc; --card: #fff;
      --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --green: #16a34a; --red: #dc2626; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font: 13px/1.5 system-ui, -apple-system, "PingFang SC", sans-serif;
      background: var(--bg); color: var(--text); width: 380px; }
    .app { padding: 12px; }
    h1 { font-size: 15px; display: flex; align-items: center; gap: 8px; padding: 2px 2px 10px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--indigo); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
    .card + .card, .card + .mt { margin-top: 10px; }
    .muted { color: var(--muted); }
    input[type="password"], input[type="text"] { width: 100%; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 13px; background: #fff; }
    button { cursor: pointer; border: none; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 500; }
    .btn-primary { background: var(--indigo); color: #fff; }
    .btn-primary:hover { background: var(--indigo-dark); }
    .btn-ghost { background: transparent; color: var(--indigo); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-block { width: 100%; margin-top: 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .label { font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border);
      background: #fff; cursor: pointer; font-size: 12px; }
    .chip.active { background: var(--indigo); border-color: var(--indigo); color: #fff; }
    .acct { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--border); }
    .acct:last-child { border-bottom: none; }
    .acct .name { flex: 1; overflow: hidden; }
    .acct .issuer { font-size: 12px; color: var(--muted); }
    .code { font: 700 20px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; }
    .copy { color: var(--muted); cursor: pointer; font-size: 12px; padding: 4px; }
    .copy:hover { color: var(--indigo); }
    .opts-btn { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px;
      border: 1px solid var(--border); border-radius: 999px; background: #fff;
      color: var(--text); font-size: 12px; font-weight: 500; cursor: pointer; }
    .opts-btn:hover { color: var(--indigo); border-color: var(--indigo); }
    .clickable { cursor: pointer; }
    .clickable:hover { color: var(--indigo); }
    .acct-link:hover { text-decoration: underline; }
    .progress { height: 3px; background: var(--border); border-radius: 2px; margin-top: 4px; overflow: hidden; }
    .progress > i { display: block; height: 100%; background: var(--indigo); transition: width 1s linear; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; }
    .err { color: var(--red); font-size: 12px; margin-top: 6px; }
    .ok { color: var(--green); font-size: 12px; margin-top: 6px; }
    .switch { position: relative; width: 36px; height: 20px; display: inline-block; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 999px; transition: .2s; }
    .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px;
      background: #fff; border-radius: 50%; transition: .2s; }
    .switch input:checked + .slider { background: var(--indigo); }
    .switch input:checked + .slider::before { transform: translateX(16px); }
    .status { font-size: 12px; color: var(--muted); margin-top: 6px; word-break: break-all; }
    .empty { text-align: center; padding: 18px 0; color: var(--muted); }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <script src="popup.js"></script>
</body>
</html>
